name: Ruby

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec:
    name: spec (${{ matrix.gem }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        gem:
          - bareruby
          - bareruby-compiler
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install dependencies
        run: bundle install
        working-directory: gems/${{ matrix.gem }}
      - name: Run the specs
        run: bundle exec rspec
        working-directory: gems/${{ matrix.gem }}

  rubocop:
    name: rubocop (${{ matrix.gem }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        gem:
          - bareruby
          - bareruby-compiler
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install dependencies
        run: bundle install
        working-directory: gems/${{ matrix.gem }}
      - name: Run RuboCop
        run: bundle exec rubocop
        working-directory: gems/${{ matrix.gem }}
